apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service-deployment
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        type: business
        app: review-service
    spec:
      containers:
      - image: e2rabi11/simple-store-review:latest
        name: review-service
        ports:
        - containerPort: 8082
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: docker
        resources:
          requests:
            memory: "200Mi"
            cpu: "500m"
          limits:
            memory: "250Mi"
            cpu: "1"
