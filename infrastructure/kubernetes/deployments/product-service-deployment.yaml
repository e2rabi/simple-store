apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service-deployment
  namespace: dev
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        type: business
        app: product-service
    spec:
      containers:
      - image: e2rabi11/simple-store-product:latest
        name: product-service
        ports:
        - containerPort: 8081
        env:
          - name: SPRING_PROFILES_ACTIVE
            value: docker
        resources:
          requests:
            memory: "200Mi"
            cpu: "500m"
          limits:
            memory: "250Mi"
            cpu: "1"
