apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin-deployment
  namespace: dev
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: zipkin-server
  template:
    metadata:
      labels:
        app: zipkin-server
    spec:
      securityContext:
        runAsUser: 1000
      automountServiceAccountToken: false # Disable automating of default service account token
      containers:
      - image: openzipkin/zipkin
        name: zipkin-server
        ports:
        - containerPort: 9411
