
server:
  port: 8010
  forward-headers-strategy: framework
spring:
  boot:
    admin:
      client:
        url: http://localhost:8889
  application:
    name: product-composite
  config:
      import: "configserver:"
  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 3000
        multiplier: 1.3
        max-interval: 10000
        max-attempts: 20
      uri: http://localhost:8888
      enabled: true
      username: admin
      password: admin
    stream:
      bindings:
        output-out-0:
          destination: product
        output-out-1:
          destination: review
        output-out-2:
          destination: recommendation
      kafka:
        binder:
          brokers: localhost:9092
springdoc:
  swagger-ui.path: /openapi/swagger-ui.html
  api-docs.path: /openapi/v3/api-docs
  packagesToScan: ma.errabi.microservice.composite
  pathsToMatch: /**

app:
  product-service:
    host: http://PRODUCT-SERVICE
  review-service:
    host: http://REVIEW-SERVICE
  recommendation-service:
    host: http://RECOMMENDATION-SERVICE
  eureka:
    username: admin
    password: admin
api:
  common:
    version: 1.0.0
    title: Sample API
    description: Description of the API...
    termsOfService: MY TERMS OF SERVICE
    license: MY LICENSE
    licenseUrl: MY LICENSE URL
    externalDocDesc: MY WIKI PAGE
    externalDocUrl: MY WIKI URL
    contact:
      name: NAME OF CONTACT
      url: URL TO CONTACT
      email: contact@mail.com

eureka:
  client:
    serviceUrl:
      defaultZone: "http://${app.eureka.username}:${app.eureka.password}@127.0.0.1:8761/eureka/"
    initial-instance-info-replication-interval-seconds: 0
    registry-fetch-interval-seconds: 5
    fetch-registry: true
  instance:
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 5
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      productService:
        registerHealthIndicator: true
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 4
        waitDurationInOpenState: 5s
        ignore-exceptions:
          - ma.errabi.sdk.exception.EntityNotFoundException
  retry:
    instances:
      productServiceRetry:
        maxAttempts: 3
        waitDuration: 1000ms
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
  health:
    circuitBreakers:
      enabled: true
logging:
  level:
    root: INFO
    org.springframework.cloud.client.loadbalancer: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
    org.springframework.cloud.netflix.eureka: DEBUG