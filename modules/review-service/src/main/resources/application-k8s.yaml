server:
  port: 8083
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  boot:
    admin:
      client:
        url: "http://${METRIC_SERVICE_SERVICE_HOST}:${METRIC_SERVICE_SERVICE_PORT}"
        instance:
          service-base-url: "http://${REVIEW-SERVICE_SERVICE_HOST}:${REVIEW-SERVICE_SERVICE_PORT}"
          metadata:
            name: review-service
  application:
    name: review-service
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://ep-curly-thunder-a5bovt5y.us-east-2.aws.neon.tech:5432/review
    username: ${review-db-username}
    password: ${review-db-password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  cloud:
    config:
      enabled: false
    loadbalancer:
      enabled: false
    stream:
      bindings:
        deleteReviewConsumer-in-0:
          destination: review
          group: review-consumer-group
      kafka:
        binder:
          brokers: "${KAFKA_SERVICE_SERVICE_HOST}:${KAFKA_SERVICE_SERVICE_PORT}"
          consumer-properties:
            enable.auto.commit: false
app:
  eureka:
    username: ${EUREKA_USERNAME}
    password: ${EUREKA_PASSWORD}
eureka:
  client:
    enabled: false
    service-url:
      defaultZone: "http://${app.eureka.username}:${app.eureka.password}@${EUREKA_SERVICE_SERVICE_HOST}:8761/eureka/"
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "http://${ZIPKIN_SERVICE_SERVICE_HOST}:${ZIPKIN_SERVICE_SERVICE_PORT}/api/v2/spans"
  endpoints:
    web:
      exposure:
        include: "*"