
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  boot:
    admin:
      client:
        url: "http://${METRIC_SERVICE_SERVICE_HOST}:${METRIC_SERVICE_SERVICE_PORT}"
        instance:
          service-base-url: "http://${API_GATEWAY_SERVICE_SERVICE_HOST}:${API_GATEWAY_SERVICE_SERVICE_PORT}"
          metadata:
            name: api-gateway-service
  config:
    activate:
      on-profile: k8s
    import: "configserver:"
  application:
    name: api-gateway-k8s
  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 3000
        multiplier: 1.3
        max-interval: 10000
        max-attempts: 20
      uri: http://config-service:8888
      username: admin
      password: admin