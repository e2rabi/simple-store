server:
  port: 8083
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  boot:
    admin:
      client:
        url: "http://${METRIC_SERVICE_SERVICE_HOST}:${METRIC_SERVICE_SERVICE_PORT}"
        instance:
          service-base-url: "http://${PRODUCT_COMPOSITE_SERVICE_SERVICE_HOST}:${PRODUCT_COMPOSITE_SERVICE_SERVICE_PORT}"
          metadata:
            name: recommendation-service
  application:
    name: recommendation-service
  datasource:
    url: jdbc:postgresql://ep-curly-thunder-a5bovt5y.us-east-2.aws.neon.tech:5432/review?schema=recommendation
    username: review
    password: RVlCws5U0QTu
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  cloud:
    config:
      enabled: false
    stream:
      bindings:
        deleteRecommendationConsumer-in-0:
          destination: recommendation
          group: recommendation-consumer-group
      kafka:
        binder:
          brokers: "${KAFKA_SERVICE_SERVICE_HOST}:${KAFKA_SERVICE_SERVICE_PORT}"
          consumer-properties:
            enable.auto.commit: false
management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: "http://${ZIPKIN_SERVICE_SERVICE_HOST}:${ZIPKIN_SERVICE_SERVICE_PORT}/api/v2/spans"
  endpoints:
    web:
      exposure:
        include: "*"
app:
  eureka:
    username: admin
    password: admin
eureka:
  client:
    enabled: false
    service-url:
      defaultZone: "http://${app.eureka.username}:${app.eureka.password}@${EUREKA_SERVICE_SERVICE_HOST}:8761/eureka/"
